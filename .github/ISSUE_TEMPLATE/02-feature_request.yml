name: 功能建议
description: 提议与 nikonikoni blog 直接相关的改进
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - ldx-ckz
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 请先说明使用场景或当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为，不需要预先设计完整实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
