name: Bug 报告
description: 报告博客页面、内容或构建流程中的可复现问题
title: "[Bug]: "
labels: ["bug"]
assignees:
  - ldx-ckz
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请尽量提供可以复现问题的最小信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 相关页面
      placeholder: https://miku.nikonikoni.blog/...
  - type: input
    id: environment
    attributes:
      label: 浏览器与设备
      placeholder: 例如 Chrome / Windows 11 / 桌面端
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可附上截图、控制台错误或其他线索。
